name: Idea
description: Suggest a feature or an update source Ripe doesn't know yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first; a proposed solution is welcome but optional.
    validations:
      required: true
  - type: textarea
    id: apps
    attributes:
      label: Apps this affects
      description: For a new update source, name a few apps that would benefit.
