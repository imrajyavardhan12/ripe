name: Release

# Push a tag like v0.3.0 to publish a universal binary with a checksum and a build-provenance
# attestation (verify with `gh attestation verify ripe-*.tar.gz -R imrajyavardhan12/ripe`), update
# the formula in imrajyavardhan12/homebrew-tap, then install it from the tap on a clean machine
# to prove what users get works. See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Fine-grained token with Contents: read and write on homebrew-tap only. Without it the
      # release still publishes and the tap step is skipped.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tap-updated: ${{ steps.tap.outputs.updated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Read version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?( |$)" {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Stamp version
        run: |
          sed -i '' "s/static let version = \".*\"/static let version = \"${VERSION}\"/" Sources/RipeCore/Ripe.swift
          grep -q "\"${VERSION}\"" Sources/RipeCore/Ripe.swift
      - run: make test
      - run: make release
      - name: Check the formula before publishing anything
        run: scripts/check-formula.sh dist/ripe "$VERSION"
      - name: Package
        run: |
          archive="ripe-${VERSION}-universal-macos.tar.gz"
          tar -czf "$archive" -C dist ripe
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          dist/ripe --version | grep -qx "$VERSION"
          lipo -archs dist/ripe | grep -q x86_64 && lipo -archs dist/ripe | grep -q arm64
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --notes-file notes.md --title "v${VERSION}")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" "${flags[@]}"
      - name: Update Homebrew tap
        id: tap
        if: env.HOMEBREW_TAP_TOKEN != '' && env.PRERELEASE == 'false'
        run: |
          sha256="$(cut -d' ' -f1 "$ARCHIVE.sha256")"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/imrajyavardhan12/homebrew-tap.git" tap
          scripts/formula.sh "$VERSION" "$sha256" > tap/Formula/ripe.rb
          cd tap
          git config user.name "ripe release"
          git config user.email "ripe-release@users.noreply.github.com"
          git add Formula/ripe.rb
          git commit -m "ripe ${VERSION}"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"

  # What users actually run, on a machine that never saw the build.
  verify-tap:
    needs: release
    if: needs.release.outputs.tap-updated == 'true'
    runs-on: macos-26
    steps:
      - name: Install from the tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          brew tap imrajyavardhan12/tap
          brew install imrajyavardhan12/tap/ripe
          ripe --version | grep -qx "$VERSION"
          brew test imrajyavardhan12/tap/ripe
          echo "ripe $VERSION installs from the tap and passes brew test"
