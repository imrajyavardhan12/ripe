name: Release

# Push a tag like v0.1.0 to publish a universal binary with a checksum and a
# build-provenance attestation (verify with `gh attestation verify ripe-*.tar.gz -R imrajyavardhan12/ripe`).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stamp version
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i '' "s/static let version = \".*\"/static let version = \"${version}\"/" Sources/RipeCore/Ripe.swift
          grep -q "\"${version}\"" Sources/RipeCore/Ripe.swift
      - run: make test
      - run: make release
      - name: Package
        run: |
          archive="ripe-${GITHUB_REF_NAME#v}-universal-macos.tar.gz"
          tar -czf "$archive" -C dist ripe
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.ARCHIVE }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --generate-notes --verify-tag
