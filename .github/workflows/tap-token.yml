name: Tap token

# Checks the token the Release workflow uses to update the Homebrew tap: that it can still write
# to the tap, and when it expires. Read-only: it only asks GitHub about the tap repository. Fails
# 30 days before expiry, so a release never discovers a dead token.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 1 * *"  # monthly

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::HOMEBREW_TAP_TOKEN is not set"; exit 1; fi
          headers=$(mktemp)
          status=$(curl -sS -o body.json -D "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/imrajyavardhan12/homebrew-tap)
          [ "$status" = 200 ] || { echo "::error::token can't read the tap (HTTP $status)"; exit 1; }
          push=$(python3 -c 'import json; print(json.load(open("body.json")).get("permissions", {}).get("push"))')
          [ "$push" = True ] || { echo "::error::token can't write to the tap"; exit 1; }
          expiry=$(grep -i '^github-authentication-token-expiration:' "$headers" | cut -d' ' -f2- | tr -d '\r')
          echo "Token can write to the tap. Expires: ${expiry:-never}"
          echo "Tap token can write to the tap; expires ${expiry:-never}." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$expiry" ]; then
            left=$(( ( $(date -d "$expiry" +%s) - $(date +%s) ) / 86400 ))
            if [ "$left" -lt 30 ]; then
              echo "::error::tap token expires in $left days ($expiry): make a new one (docs/releasing.md)"
              exit 1
            fi
          fi
