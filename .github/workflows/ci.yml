name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Pinned image and Xcode: a GitHub-side default change must never silently change what we
    # build or drop the Intel slice. Bump deliberately (see docs/releasing.md).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Universal release build
        run: make release
      - name: Smoke test
        run: dist/ripe --version && dist/ripe --help
      - name: Homebrew formula
        run: scripts/check-formula.sh dist/ripe
