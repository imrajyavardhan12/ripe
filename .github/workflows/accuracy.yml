name: Accuracy

# Installs the latest version of 80 popular apps on clean Macs and runs Ripe on them. A fresh
# install must never be reported as outdated, so a run fails on any false positive. Several
# machines, because per-CPU and per-macOS rules (Sparkle hardware requirements, cask variations)
# only show up there. Results go to each job's summary; record notable runs in docs/accuracy.md.
on:
  workflow_dispatch:
    inputs:
      list:
        description: Which apps
        type: choice
        options: [core, extended]
        default: core
  schedule:
    - cron: "0 6 * * 1"  # Mondays, core list: catches upstream format drift and new version schemes
    - cron: "0 6 15 * *"  # the 15th, extended list: a wider net

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Universal build
        run: make release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ripe
          path: dist/ripe
          if-no-files-found: error

  accuracy:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150  # the extended list on the slower macOS 15 runners takes over an hour
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ripe
          path: dist
      - name: Install apps and check them
        run: |
          chmod +x dist/ripe
          dist/ripe --version
          scripts/accuracy/run.sh dist/ripe "$RUNNER_TEMP/accuracy" "scripts/accuracy/$LIST"
        env:
          LIST: ${{ (inputs.list == 'extended' || github.event.schedule == '0 6 15 * *') && 'casks-extended.txt' || 'casks.txt' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: accuracy-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/accuracy/*.json
            ${{ runner.temp }}/accuracy/*.tsv
            ${{ runner.temp }}/accuracy/*.log
          if-no-files-found: warn
