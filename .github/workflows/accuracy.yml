name: Accuracy

# Installs the latest version of 80 popular apps on a clean Mac and runs Ripe on them. A fresh
# install must never be reported as outdated, so the run fails on any false positive. Results go
# to the job summary; record notable runs in docs/accuracy.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays: catches upstream format drift and new version schemes

permissions:
  contents: read

jobs:
  accuracy:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Build
        run: make release
      - name: Install apps and check them
        run: scripts/accuracy/run.sh dist/ripe "$RUNNER_TEMP/accuracy"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: accuracy
          path: |
            ${{ runner.temp }}/accuracy/*.json
            ${{ runner.temp }}/accuracy/*.tsv
            ${{ runner.temp }}/accuracy/*.log
          if-no-files-found: warn
